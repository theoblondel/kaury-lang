faq:
  - q: What is Kaury?
    a: Kaury is an open-source programming language for websites. One .kaury file holds the logic, the structure, the style and the 3D of a site; the compiler turns it into server-rendered HTML, CSS and JavaScript that score 100 on all four Lighthouse categories.
  - q: Is Kaury free?
    a: Yes. The compiler, the runtime, the command line and the VS Code extension are open source under the MIT license.
  - q: Do I need to know JavaScript, React or Three.js?
    a: No. Kaury is a complete language of its own, with readable keywords. You can still import any npm package or write a js block when you want to.
  - q: How does Kaury add 3D without slowing the site down?
    a: The 3D library loads only on pages that contain a scene, when the scene becomes visible and after the visitor's first gesture. The text of the page is real HTML rendered on the server, so it is readable instantly.
  - q: Can ChatGPT, Claude or Cursor write Kaury?
    a: Yes. The whole language fits in one specification file, kaury-ai.md, written for AI assistants. Paste it, or its address, into your assistant and ask for a site.
  - q: Where can I host a Kaury site?
    a: Anywhere. kaury build produces a static site in dist/ that works on Netlify, Vercel, Cloudflare Pages, GitHub Pages or any web server. kaury deploy --netlify publishes it in one command.
  - q: How is Kaury different from Astro, Next.js or Webflow?
    a: Kaury is a language, not a framework or a visual builder. There is no JSX, no component library to learn and no configuration; immersion (3D, scenes, characters) is part of the syntax, and SEO, llms.txt and structured data are generated by default.
promises:
  - n: "01"
    t: Simple to write
    d: One line, one idea. Errors that tell you the fix.
    c: 'button "+1" -> count += 1'
  - n: "02"
    t: 100 on Lighthouse
    d: Server rendering, inlined CSS, WebP, self-hosted fonts. By default.
    c: kaury build → dist/
  - n: "03"
    t: 3D is a word
    d: Scenes, lights, cameras, particles. Three.js loads only where needed.
    c: 'object "can.glb", spin on scroll'
features:
  - t: Reactive
    d: Change a value, the page follows.
    i: ill/reactive.svg
  - t: Content
    d: Markdown and YAML, one page per post.
    i: ill/content.svg
  - t: SEO & GEO
    d: Sitemap, llms.txt, JSON-LD, Open Graph.
    i: ill/seo.svg
  - t: Mobile first
    d: Grids fold, menus collapse by themselves.
    i: ill/mobile.svg
  - t: Open to JS
    d: Any npm package, or a js block.
    i: ill/javascript.svg
  - t: Editor
    d: VS Code coloring, completion, live errors.
    i: ill/editor.svg
words: [page, title, button, state, scene, object, light, camera, form, for, if, markdown, spin, follows mouse, enters from bottom, particles stars, json-ld, persist, grid, card]
ai:
  - t: One way to do each thing
    d: Less to guess, fewer wrong guesses.
  - t: Short and regular
    d: A full site fits in one answer.
  - t: Errors for machines
    d: "kaury check --json: line, word, fix."
