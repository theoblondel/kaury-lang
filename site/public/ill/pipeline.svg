<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" font-family="JetBrains Mono, ui-monospace, monospace">
<style>
.flow{stroke:#1C1A1A;stroke-width:3;fill:none;stroke-dasharray:10 10;animation:f 1.2s linear infinite}
@keyframes f{to{stroke-dashoffset:-40}}
.dot{fill:#F56E2E;animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.35)}}
.line{fill:#F1E8CB;opacity:.85;transform-box:fill-box;transform-origin:left;animation:w 3.2s ease-in-out infinite}
@keyframes w{0%{transform:scaleX(.2)}40%,100%{transform:scaleX(1)}}
.gear{transform-origin:600px 170px;animation:r 6s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.chip{animation:u 3.2s ease-in-out infinite}
.c2{animation-delay:.25s}.c3{animation-delay:.5s}
@keyframes u{0%,30%{transform:translateY(8px);opacity:0}45%,100%{transform:none;opacity:1}}
.ring{stroke:#F56E2E;stroke-width:12;fill:none;stroke-linecap:round;stroke-dasharray:283;stroke-dashoffset:283;transform:rotate(-90deg);transform-origin:1090px 170px;animation:g 3.2s ease-out infinite}
@keyframes g{40%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ring{stroke-dashoffset:0}.chip{opacity:1}}
</style>
<rect x="20" y="60" width="300" height="220" rx="24" fill="#1C1A1A"/>
<circle cx="52" cy="92" r="6" fill="#F56E2E"/><text x="68" y="97" fill="#F1E8CB" font-size="16">site.kaury</text>
<rect class="line" x="48" y="128" width="170" height="10" rx="5"/>
<rect class="line" x="68" y="152" width="210" height="10" rx="5" style="animation-delay:.15s"/>
<rect class="line" x="88" y="176" width="140" height="10" rx="5" fill="#F56E2E" style="animation-delay:.3s"/>
<rect class="line" x="88" y="200" width="190" height="10" rx="5" style="animation-delay:.45s"/>
<rect class="line" x="68" y="224" width="120" height="10" rx="5" style="animation-delay:.6s"/>
<path class="flow" d="M330 170H500"/>
<circle class="dot" cx="415" cy="170" r="7" style="transform-origin:415px 170px"/>
<g class="gear"><path d="M600 110l12 2 6 16 14 6 15-7 16 16-7 15 6 14 16 6v24l-16 6-6 14 7 15-16 16-15-7-14 6-6 16h-24l-6-16-14-6-15 7-16-16 7-15-6-14-16-6v-24l16-6 6-14-7-15 16-16 15 7 14-6 6-16z" fill="#F56E2E" stroke="#1C1A1A" stroke-width="3"/><circle cx="600" cy="170" r="26" fill="#F1E8CB" stroke="#1C1A1A" stroke-width="3"/></g>
<text x="600" y="300" text-anchor="middle" font-size="18" fill="#1C1A1A">kaury build</text>
<path class="flow" d="M700 170H820"/>
<g class="chip"><rect x="830" y="92" width="130" height="44" rx="22" fill="#F1E8CB" stroke="#1C1A1A" stroke-width="3"/><text x="895" y="120" text-anchor="middle" font-size="17" fill="#1C1A1A" font-weight="700">HTML</text></g>
<g class="chip c2"><rect x="830" y="148" width="130" height="44" rx="22" fill="#E9DDB9" stroke="#1C1A1A" stroke-width="3"/><text x="895" y="176" text-anchor="middle" font-size="17" fill="#1C1A1A" font-weight="700">CSS</text></g>
<g class="chip c3"><rect x="830" y="204" width="130" height="44" rx="22" fill="#1C1A1A" stroke="#1C1A1A" stroke-width="3"/><text x="895" y="232" text-anchor="middle" font-size="17" fill="#F1E8CB" font-weight="700">JS</text></g>
<path class="flow" d="M965 170H1030"/>
<circle cx="1090" cy="170" r="45" fill="none" stroke="#1C1A1A" stroke-opacity=".15" stroke-width="12"/>
<circle class="ring" cx="1090" cy="170" r="45"/>
<text x="1090" y="180" text-anchor="middle" font-size="28" font-weight="800" fill="#1C1A1A" font-family="Cabinet Grotesk, Arial Black, sans-serif">100</text>
<text x="1090" y="250" text-anchor="middle" font-size="15" fill="#1C1A1A">Lighthouse</text>
</svg>
