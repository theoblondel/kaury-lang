<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrain de jeu Kaury</title>
<meta name="description" content="Écris du Kaury à gauche, vois le site à droite. Rien à installer.">
<style>
  :root{--fond:#0f0d14;--panneau:#17141f;--ligne:#2a2535;--texte:#f3eef7;--doux:#9d95ab;--rose:#ff4f8b}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--fond);color:var(--texte);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--ligne)}
  header b{font-size:18px;letter-spacing:-.02em}
  header b span{color:var(--rose)}
  select,button{background:var(--panneau);color:var(--texte);border:1px solid var(--ligne);border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer}
  button.principal{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:600}
  .etat{margin-left:auto;color:var(--doux);font-size:13px}
  main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);height:calc(100% - 55px)}
  .code{position:relative;border-right:1px solid var(--ligne);display:flex;flex-direction:column;min-height:0}
  textarea{flex:1;width:100%;resize:none;border:0;outline:0;padding:18px;background:var(--fond);color:var(--texte);font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2;white-space:pre}
  #erreurs{max-height:40%;overflow:auto;margin:0;padding:0;font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;color:#ffc6d6;background:#21122a;border-top:1px solid #ff4f8b55}
  #erreurs:not(:empty){padding:14px 18px}
  iframe{width:100%;height:100%;border:0;background:#fff}
  @media (max-width:800px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.code{border-right:0;border-bottom:1px solid var(--ligne)}}
</style>
</head>
<body>
<header>
  <b>Kaury <span>·</span> terrain de jeu</b>
  <select id="exemples" aria-label="Exemples">
    <option value="compteur">Compteur</option>
    <option value="scene">Scène immersive</option>
    <option value="liste">Liste de tâches</option>
    <option value="formulaire">Formulaire</option>
  </select>
  <button id="partager">Copier le lien</button>
  <span class="etat" id="etat">prêt</span>
</header>
<main>
  <div class="code">
    <textarea id="source" spellcheck="false" aria-label="Code Kaury"></textarea>
    <pre id="erreurs" role="alert"></pre>
  </div>
  <iframe id="apercu" title="Aperçu du site"></iframe>
</main>
<script type="module">
import { compile } from './kaury-compilateur.js'

const EXEMPLES = {
  compteur: `etat compteur = 0
soit double = compteur * 2

page "/"
  section plein-ecran, centre
    titre "Kaury", taille 96, texte-degrade rose violet
      entre depuis bas
    texte "Clique : le double se calcule tout seul ({double})."
    bouton "J'aime {compteur}", grand -> compteur += 1
    si compteur >= 5
      texte "Tu aimes vraiment ça !", gras, rose
`,
  scene: `page "/"
  scene plein-ecran, particules etoiles, fond nuit
    lumiere nuit
    objet etoile "etoile.svg", taille 0.8
      flotte
      suit souris, doux
      au clic -> saute
      dit "Clique-moi !"
    titre "Un univers en 10 lignes", taille 72, couleur blanc
      entre depuis bas
`,
  liste: `etat taches = ["Écrire la spec", "Coder le lecteur"]
etat nouvelle = ""

page "/"
  section centre
    titre "Mes tâches ({taches.longueur})", taille 48
    formulaire -> ajoute-tache()
      ligne espace 8
        champ nouvelle "Nouvelle tâche…"
        bouton "Ajouter"
    pour t dans taches
      ligne espace 12
        texte t
        bouton "✓", petit, discret -> taches.retire t
    si taches.longueur == 0
      texte "Tout est fait 🎉"

fonction ajoute-tache
  si nouvelle.nettoie() != ""
    taches.ajoute nouvelle
    nouvelle = ""
`,
  formulaire: `page "/"
  section centre
    titre "Contact", taille 56
    formulaire -> envoye = vrai
      champ nom "Ton prénom", requis, etiquette "Prénom"
      champ email "nom@exemple.ch", type email, requis, etiquette "E-mail"
      choix sujet "Un site", "Une vidéo", "Autre", etiquette "Sujet"
      case accepte "J'accepte d'être recontacté"
      bouton "Envoyer", desactive non accepte
    si envoye
      texte "Merci {nom}, réponse à {email} sous 24 h.", gras
`,
}

const src = document.getElementById('source')
const erreurs = document.getElementById('erreurs')
const apercu = document.getElementById('apercu')
const etat = document.getElementById('etat')
const base = new URL('./', location.href).href

function depuisLien() {
  const h = location.hash.slice(1)
  if (!h) return null
  try { return decodeURIComponent(escape(atob(h))) } catch { return null }
}
src.value = depuisLien() ?? EXEMPLES.compteur

let minuteur
function lance() {
  const t0 = performance.now()
  const r = compile(src.value, { fichier: 'site.kaury', runtime: 'kaury/runtime' })
  erreurs.textContent = [...r.erreurs, ...r.avertissements].map((e) => e.formate(src.value)).join('\n\n')
  if (!r.ok) { etat.textContent = `${r.erreurs.length} erreur(s)`; return }
  etat.textContent = `compilé en ${Math.round(performance.now() - t0)} ms`
  const code = r.js.replaceAll('</script', '<\\/script')
  apercu.srcdoc = `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base href="${base}">
${r.polices.map((p) => `<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=${p.replace(/ /g, '+')}:wght@400;600;700&display=swap">`).join('')}
<script type="importmap">{"imports":{"kaury/runtime":"${base}rt/runtime.js"}}<\/script>
<style id="css"></style><script>document.documentElement.classList.add('k-js')<\/script></head>
<body><div id="app"></div>
<script type="module">
import * as $k from 'kaury/runtime'
document.getElementById('css').textContent = $k.STYLE_DE_BASE + ${JSON.stringify(r.css)}
globalThis.__kauryDev = true
const url = URL.createObjectURL(new Blob([${JSON.stringify(code)}], { type: 'text/javascript' }))
const mod = await import(url)
const app = document.getElementById('app')
$k.demarreGlobaux()
const va = (c) => { const i = $k.rendsPage(mod, c, app); document.title = i.titre }
va('/')
document.addEventListener('click', (e) => {
  const a = e.target.closest('a'); if (!a) return
  const h = a.getAttribute('href') || ''
  if (h.startsWith('/')) { e.preventDefault(); va(h) }
})
<\/script></body></html>`
}
src.addEventListener('input', () => { clearTimeout(minuteur); minuteur = setTimeout(lance, 300) })
src.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault()
    const { selectionStart: d, selectionEnd: f } = src
    src.setRangeText('  ', d, f, 'end')
    lance()
  }
})
document.getElementById('exemples').addEventListener('change', (e) => { src.value = EXEMPLES[e.target.value]; lance() })
document.getElementById('partager').addEventListener('click', async () => {
  location.hash = btoa(unescape(encodeURIComponent(src.value)))
  await navigator.clipboard?.writeText(location.href)
  etat.textContent = 'lien copié'
})
lance()
</script>
</body>
</html>
